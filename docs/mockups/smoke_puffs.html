<title>Lit Smoke Puffs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: a full-bleed game view with a slim control strip under it, single dark look (it is a game screen). */
:root {
  --bg: #0d1013; --panel: #161b20; --fg: #e3e7ea; --muted: #8e99a3; --rule: #2a323a;
  --accent: #7fd18b; --warn: #e8a24a;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--mono); display: flex; flex-direction: column; }
#view { position: relative; flex: 1 1 auto; min-height: 320px; }
#view canvas { display: block; width: 100%; height: 100%; }
.hud { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 14px; display: grid; gap: 2px; pointer-events: none; text-shadow: 0 1px 2px #000; }
.hud h1 { margin: 0; font: 700 1.6rem/1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
.hud p { margin: 0; color: var(--muted); font-size: 12px; max-width: 46ch; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--panel); border-top: 1px solid var(--rule);
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
.seg button, .bar > button { font: 600 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--fg); background: transparent; border: 0; padding: 8px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #0d1013; }
.bar > button { border: 1px solid var(--rule); border-radius: 4px; }
.bar > button:hover, .seg button:hover { outline: 1px solid var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.note { color: var(--muted); font-size: 12px; margin-left: auto; min-width: 0; }
.stat { color: var(--warn); }
</style>

<div id="view">
  <div class="hud">
    <h1>Lit smoke puffs</h1>
    <p>Preview for Crab Breeze: smoke drawn like the clouds (sun wrapped round each blob, darker underside, silver edge toward the sun, soft silhouette). Drag to orbit, scroll to zoom.</p>
  </div>
</div>
<div class="bar">
  <span class="seg" role="group" aria-label="Smoke drawn as">
    <button id="m-puffs" aria-pressed="true">Lit puffs</button>
    <button id="m-sprites" aria-pressed="false">Flat sprites (today)</button>
  </span>
  <button id="shell">Shell burst</button>
  <button id="missile">Missile</button>
  <button id="lift">Jets: lifting</button>
  <span class="note">puffs alive <span class="stat" id="count">0</span></span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
  const view = document.getElementById('view');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  view.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9fb8d2);
  scene.fog = new THREE.Fog(0xb7c8da, 250, 1400);
  const camera = new THREE.PerspectiveCamera(60, 1, 0.5, 4000);
  camera.position.set(4, 12, 62);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 20, -90);
  controls.enableDamping = true;

  // The sun, as in the game: high, warm, from the side.
  const SUN = new THREE.Vector3(0.55, 0.62, -0.56).normalize();
  const SUN_COL = new THREE.Color(1.0, 0.95, 0.86).multiplyScalar(2.6);
  const AMB_COL = new THREE.Color(0.52, 0.62, 0.78).multiplyScalar(0.9);
  const sunLight = new THREE.DirectionalLight(0xfff2dc, 2.2);
  sunLight.position.copy(SUN).multiplyScalar(300);
  scene.add(sunLight, new THREE.HemisphereLight(0xbcd2ee, 0x4a4f55, 0.75));

  // A city street: road, kerbs, office blocks on both sides, a wreck, a mech.
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.MeshLambertMaterial({ color: 0x3b4150 }));
  ground.rotation.x = -Math.PI / 2; scene.add(ground);
  const pave = new THREE.MeshLambertMaterial({ color: 0x8d8f93 });
  for (const s of [-1, 1]) { const k = new THREE.Mesh(new THREE.BoxGeometry(8, 0.3, 900), pave); k.position.set(s * 20, 0.15, -200); scene.add(k); }
  const tones = [0xd8d4cc, 0xbfc4c9, 0x9fb1c6, 0xcfc7b8, 0xa8b7c4];
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let z = 40; z > -700; z -= 46) for (const s of [-1, 1]) {
    const h = 30 + rnd() * 90, w = 34 + rnd() * 10, d = 38;
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color: tones[Math.floor(rnd() * tones.length)] }));
    b.position.set(s * (26 + w / 2), h / 2, z); scene.add(b);
    const win = new THREE.Mesh(new THREE.BoxGeometry(0.2, h - 6, d - 6), new THREE.MeshLambertMaterial({ color: 0x2c4a6a }));
    win.position.set(s * 26 - s * 0.05, h / 2, z); scene.add(win);
  }
  const dark = new THREE.MeshLambertMaterial({ color: 0x2a2c2e });
  const wreck = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.BoxGeometry(6, 4, 9), dark); hull.position.y = 2; hull.rotation.y = 0.5; wreck.add(hull);
  const leg = new THREE.Mesh(new THREE.BoxGeometry(1.4, 6, 1.4), dark); leg.position.set(3, 1.5, 3); leg.rotation.z = 1.1; wreck.add(leg);
  wreck.position.set(8, 0, -60); scene.add(wreck);
  const mech = new THREE.Group();
  const metal = new THREE.MeshLambertMaterial({ color: 0x8a9096 });
  const torso = new THREE.Mesh(new THREE.BoxGeometry(8, 7, 6), metal); torso.position.y = 17; mech.add(torso);
  for (const s of [-1, 1]) { const l = new THREE.Mesh(new THREE.BoxGeometry(2.2, 14, 2.2), metal); l.position.set(s * 3, 7, 0); mech.add(l); }
  mech.position.set(-10, 0, -10); scene.add(mech);
  const JETS = [new THREE.Vector3(-2.2, 15.5, 3.2), new THREE.Vector3(2.2, 15.5, 3.2)];

  // One lumpy blob for every puff (as the clouds' blob: an icosphere pushed out by noise).
  const blob = new THREE.IcosahedronGeometry(1, 3);
  { const p = blob.attributes.position, v = new THREE.Vector3();
    for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i).normalize();
      const n = 0.6 * Math.sin(v.x * 3.1 + v.y * 2.3) * Math.cos(v.y * 2.7 - v.z * 3.3) + 0.3 * Math.sin(v.z * 6.1 + v.x * 4.7);
      v.multiplyScalar(1 + 0.16 * n); p.setXYZ(i, v.x, v.y, v.z); }
    blob.computeVertexNormals(); }

  // The cloud lighting (assets/shaders/cloud.wesl), per puff: colour, opacity.
  const puffVert = `varying vec3 vN; varying vec3 vP;
    void main(){ vN = normalize(mat3(modelMatrix) * normal); vec4 w = modelMatrix * vec4(position,1.0); vP = w.xyz;
      gl_Position = projectionMatrix * viewMatrix * w; }`;
  const puffFrag = `uniform vec3 sunDir; uniform vec3 sunCol; uniform vec3 ambCol; uniform vec3 colour; uniform float opacity;
    varying vec3 vN; varying vec3 vP;
    void main(){
      vec3 n = normalize(vN); vec3 look = normalize(vP - cameraPosition);
      float wrap = 0.55;
      float diffuse = clamp((dot(n, sunDir) + wrap) / (1.0 + wrap), 0.0, 1.0);
      float body = mix(0.55, 1.0, smoothstep(-0.8, 0.5, n.y));            // darker underneath
      float facing = abs(dot(n, look)); float edge = 1.0 - facing;
      float silver = pow(max(dot(look, sunDir), 0.0), 6.0) * edge * edge * 1.4; // lining toward the sun
      vec3 lit = sunCol * colour / 3.14159 * (diffuse * body + silver) + ambCol * colour * mix(0.55, 1.0, n.y * 0.5 + 0.5);
      float soft = smoothstep(0.0, 0.45, facing);                          // soft silhouette
      gl_FragColor = vec4(lit, soft * opacity);
      #include <tonemapping_fragment>
      #include <encodings_fragment>
    }`;
  const puffMaterial = (colour) => new THREE.ShaderMaterial({
    uniforms: { sunDir: { value: SUN }, sunCol: { value: new THREE.Vector3(SUN_COL.r, SUN_COL.g, SUN_COL.b) },
      ambCol: { value: new THREE.Vector3(AMB_COL.r, AMB_COL.g, AMB_COL.b) }, colour: { value: new THREE.Vector3(...colour) }, opacity: { value: 0 } },
    vertexShader: puffVert, fragmentShader: puffFrag, transparent: true, depthWrite: false });

  // Today's look, for comparison: flat, unlit soft discs facing the camera, warm-tinted.
  const disc = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
    const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
  const spriteTint = (colour) => new THREE.Color(Math.min(1, colour[0] * 2.2 + 0.18), Math.min(1, colour[1] * 1.8 + 0.08), Math.min(1, colour[2] * 1.4));

  // Recipes: the data a Puffs layer would carry in fx.ron.
  const R = {
    shell:   { count: 14, size: 5,  grow: 4.0, speed: 9,  spread: 0.9, rise: 2.2, life: 7,  fade: 0.55, colour: [0.22, 0.21, 0.2], opacity: 0.9 },
    burning: { count: 1,  size: 3,  grow: 2.6, speed: 2,  spread: 0.3, rise: 4.5, life: 9,  fade: 0.6,  colour: [0.16, 0.15, 0.15], opacity: 0.85 },
    missile: { count: 1,  size: 1.4, grow: 1.6, speed: 0.5, spread: 0.5, rise: 0.4, life: 5, fade: 0.7, colour: [0.82, 0.81, 0.79], opacity: 0.8 },
    jet:     { count: 1,  size: 2.2, grow: 2.2, speed: 6,  spread: 0.25, rise: 0.6, life: 6, fade: 0.7, colour: [0.86, 0.85, 0.83], opacity: 0.75 },
  };
  const WIND = new THREE.Vector3(2.5, 0, -0.8), DRAG = 1.2;
  let mode = 'puffs';
  const puffs = [];
  function spawn(r, at, dir) {
    for (let i = 0; i < r.count; i++) {
      const j = new THREE.Vector3(rnd() * 2 - 1, rnd() * 2 - 1, rnd() * 2 - 1).multiplyScalar(r.spread);
      const v = dir.clone().add(j).normalize().multiplyScalar(r.speed * (0.5 + rnd()));
      let obj;
      if (mode === 'puffs') { obj = new THREE.Mesh(blob, puffMaterial(r.colour)); obj.rotation.set(rnd() * 6, rnd() * 6, rnd() * 6); }
      else { obj = new THREE.Sprite(new THREE.SpriteMaterial({ map: disc, color: spriteTint(r.colour), transparent: true, depthWrite: false })); }
      obj.position.copy(at); scene.add(obj);
      puffs.push({ obj, vel: v, age: 0, r });
    }
  }
  function opacityOf(p) {
    const t = Math.min(1, p.age / p.r.life), fin = Math.min(1, p.age / 0.1);
    return p.r.opacity * fin * Math.max(0, Math.min(1, (1 - t) / p.r.fade));
  }

  // The scene's events: a shell every few seconds, a missile across the street, the wreck burning,
  // the mech lifting on its jets and settling again.
  let lifting = true, missile = null, tShell = 0.5, tMissile = 2.5, tBurn = 0, tJet = 0, tLift = 0;
  const shell = () => spawn(R.shell, new THREE.Vector3(-6 + rnd() * 18, 2, -110 - rnd() * 60), new THREE.Vector3(0, 1, 0));
  const fire = () => { missile = { pos: new THREE.Vector3(-22, 34, -260), vel: new THREE.Vector3(14, -1.2, 120), left: 3.2 }; };
  document.getElementById('shell').onclick = shell;
  document.getElementById('missile').onclick = fire;
  const liftBtn = document.getElementById('lift');
  liftBtn.onclick = () => { lifting = !lifting; liftBtn.textContent = lifting ? 'Jets: lifting' : 'Jets: off'; };
  const setMode = (m) => { mode = m;
    document.getElementById('m-puffs').setAttribute('aria-pressed', m === 'puffs');
    document.getElementById('m-sprites').setAttribute('aria-pressed', m === 'sprites');
    for (const p of puffs) scene.remove(p.obj); puffs.length = 0; };
  document.getElementById('m-puffs').onclick = () => setMode('puffs');
  document.getElementById('m-sprites').onclick = () => setMode('sprites');

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const count = document.getElementById('count');
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000) * (reduced ? 0.4 : 1); last = now;
    tShell -= dt; if (tShell <= 0) { shell(); tShell = 4.5; }
    tMissile -= dt; if (tMissile <= 0) { fire(); tMissile = 6; }
    tBurn -= dt; if (tBurn <= 0) { spawn(R.burning, wreck.position.clone().add(new THREE.Vector3(0, 4, 0)), new THREE.Vector3(0, 1, 0)); tBurn = 0.22; }
    tLift += dt; const climb = lifting ? Math.max(0, Math.sin(tLift * 0.5)) * 26 : Math.max(0, mech.position.y - dt * 8);
    mech.position.y = climb;
    if (lifting && climb > 0.5) { tJet -= dt; if (tJet <= 0) { for (const j of JETS) spawn(R.jet, mech.position.clone().add(j), new THREE.Vector3(0, -1, 0.4)); tJet = 0.12; } }
    if (missile) { missile.pos.addScaledVector(missile.vel, dt); missile.left -= dt;
      spawn(R.missile, missile.pos.clone(), missile.vel.clone().normalize().negate()); if (missile.left <= 0) missile = null; }
    for (let i = puffs.length - 1; i >= 0; i--) {
      const p = puffs[i]; p.age += dt;
      if (p.age >= p.r.life) { scene.remove(p.obj); p.obj.material.dispose(); puffs.splice(i, 1); continue; }
      p.vel.multiplyScalar(Math.exp(-DRAG * dt));
      p.obj.position.addScaledVector(p.vel, dt).addScaledVector(WIND, dt); p.obj.position.y += p.r.rise * dt;
      const size = p.r.size + p.r.grow * p.age, o = opacityOf(p);
      if (mode === 'puffs') { p.obj.scale.setScalar(size * 0.5); p.obj.material.uniforms.opacity.value = o; }
      else { p.obj.scale.setScalar(size * 1.4); p.obj.material.opacity = o * 0.8; }
    }
    count.textContent = puffs.length;
    controls.update(); renderer.render(scene, camera); requestAnimationFrame(frame);
  }
  const resize = () => { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); };
  new ResizeObserver(resize).observe(view); resize();
  requestAnimationFrame(frame);
})();
</script>
