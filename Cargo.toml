[workspace]
resolver = "3"
members = ["crates/cb-core", "crates/cb-app", "crates/cb-tools"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Proprietary"
rust-version = "1.97"

[workspace.dependencies]
cb-core = { path = "crates/cb-core" }
bevy = "=0.20.0"
glam = { version = "0.33.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Bevy systems take their data as parameters and queries; Bevy's own lint guidance allows these.
too_many_arguments = "allow"
type_complexity = "allow"

# Dependencies optimised in dev so the game is playable while iterating; numbers come from release.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# The game is CPU-bound (GPU about 0.4 ms a frame): whole-program optimisation for the build that is
# played and measured, at the cost of a longer release build.
[profile.release]
lto = "thin"
codegen-units = 1

# play-quick.bat's build: the release build without whole-program optimisation and with incremental
# compilation, so a rebuild after a small change takes far less time (owner, 2026-10-25: "it just
# takes a long time"). The game runs somewhat slower in it; benchmarks always use `release`.
[profile.play]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
