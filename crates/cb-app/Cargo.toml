[package]
name = "cb-app"
description = "Crab Breeze, the game: the Bevy adapter for cb-core."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "crab-breeze"
path = "src/main.rs"

[dependencies]
cb-core.workspace = true
# `pbr_light_textures`: the storm shade is a texture on the sun (`DirectionalLightTexture`, openspec
# change `cloud-weather`), so everything the sun lights is darkened under a storm.
bevy = { workspace = true, features = ["jpeg", "pbr_light_textures"] }
# Keeps systems' names (`DebugName`), which the ground fog's build pass needs to order itself after Bevy's
# private sky pass (`water_render::FogAfterSky`); nothing else in it changes how anything renders.
bevy_utils = { version = "=0.20.0", features = ["debug"] }
# The set type in Bevy's schedule build pass hook (`ScheduleBuildPass::collapse_set`); the version Bevy uses (Cargo.lock).
indexmap = { version = "=2.14.2", default-features = false }
avian3d = "=0.8.0"
# Decodes the ground's CC0 texture set to build its mip chain at load (Bevy 0.20 makes none for a
# PNG or JPEG); the same version Bevy itself uses (Cargo.lock).
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
# GPU particles (openspec combat-fx section 6, survey T5): its Bevy 0.20 support is on main, not yet
# released; pinned to the migration commit until the 0.20 release ships.
bevy_hanabi = { git = "https://github.com/djeedai/bevy_hanabi", rev = "77630ff1eed8b104f34e91d23e9440428dc5ab01", default-features = false, features = ["3d"] }

# The water shaders are compiled and validated in `cargo test` (openspec change `water-rendering`)
# with the same WESL compiler and naga Bevy 0.20 uses, pinned to the versions in Cargo.lock.
[dev-dependencies]
wesl = { version = "=0.6.0", features = ["naga-ext"] }
naga = { version = "=30.0.1", features = ["wgsl-in"] }

[lints]
workspace = true

[features]
# The packaged game for itch.io (itch.bat): no on-screen performance readout or frame graph.
shipping = []
# The `hitch:` lines name every system's time in a slow frame (`hitch_spans.rs`, a measurement instrument):
# `cargo build --release --features hitch_spans`. Never in the shipped game.
hitch_spans = ["bevy/trace", "bevy/debug"]
# The live performance probe on 127.0.0.1:7878 (`perf_probe.rs`, a measurement instrument; `tools/perf/probe_mcp.py`):
# `cargo build --release --features perf_probe`, with `hitch_spans` to name every system. Never in the shipped game.
perf_probe = []
